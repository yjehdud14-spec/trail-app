<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>등산로 정보</title>
<style>
  :root {
    --bg: #eef2ef; --surface: #fff; --line: #c9d4cd; --fg: #16211b; --muted: #56655c;
    --accent: #1e6a4c; --accent-ink: #fff; --ok-bg: #ddf0e6; --ok: #1e6a4c;
    --err-bg: #fce3e6; --err: #b3122a; --code-bg: #e3eae5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1512; --surface: #18211c; --line: #33423a; --fg: #e6eee9; --muted: #9aaaa1;
      --accent: #5cc497; --accent-ink: #06120c; --ok-bg: #163126; --ok: #5cc497;
      --err-bg: #3a1219; --err: #ff6b7c; --code-bg: #212c26; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main {
    max-width: 720px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 16px;
  }
  h1 { margin: 0; font-size: 24px; }
  h2 { margin: 0; font-size: 18px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; min-height: 52px; padding: 10px 14px; font: inherit;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg);
  }
  button {
    min-height: 52px; padding: 0 20px; font: inherit; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .5; cursor: wait; }
  input:focus-visible, button:focus-visible { outline: 3px solid #d9601f; outline-offset: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { min-height: 36px; padding: 0 12px; font-weight: 500; font-size: 14px;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .status.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
  .status.err { background: var(--err-bg); border-color: transparent; color: var(--err); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  .status dt { color: inherit; opacity: .8; }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  pre { margin: 0; padding: 10px; border-radius: 8px; background: var(--code-bg); color: var(--fg);
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; }
  .item h2 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item h2 small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .key { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>등산로 정보</h1>
    <p class="muted">산림청_산 정보 조회 (공공데이터포털)</p>
  </header>

  <form id="search" role="search">
    <input id="mountain" type="search" enterkeyhint="search" placeholder="산 이름 (예: 무등산)" autocomplete="off" required>
    <button id="go" type="submit">검색</button>
  </form>
  <div class="chips" aria-label="예시 검색어">
    <button type="button" data-q="무등산">무등산</button>
    <button type="button" data-q="지리산">지리산</button>
    <button type="button" data-q="한라산">한라산</button>
  </div>

  <section id="status" aria-live="polite"></section>
  <section id="results" class="results" style="display:flex;flex-direction:column;gap:12px"></section>
</main>

<script>
  // 이 페이지는 Netlify Function만 호출합니다. 인증키는 페이지에 없습니다.
  const ENDPOINT = '/.netlify/functions/trail';

  // 알려진 필드명 → 한글 이름 (모르는 필드는 원래 이름 그대로 표시)
  const LABELS = { mntnNm: '산 이름', mntnHght: '높이(m)', mntnAdd: '소재지', mntnInfoAraCd: '지역 코드', mntnInfoSsnCd: '계절 코드', mntnInfoThmCd: '주제 코드' };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function search(name) {
    name = name.trim();
    if (!name) return;
    $('go').disabled = true;
    $('status').innerHTML = `<div class="card"><p>‘${esc(name)}’ 조회 중…</p></div>`;
    $('results').innerHTML = '';

    let data, httpStatus;
    try {
      const res = await fetch(`${ENDPOINT}?mountain=${encodeURIComponent(name)}`);
      httpStatus = res.status;
      const text = await res.text();
      try { data = JSON.parse(text); }
      catch { data = { ok: false, resultCode: null, resultMsg: '함수 응답이 JSON이 아닙니다', raw: text.slice(0, 500) }; }
    } catch (e) {
      data = { ok: false, resultCode: null, resultMsg: '함수에 연결하지 못했습니다: ' + e.message };
    } finally {
      $('go').disabled = false;
    }
    renderStatus(name, data, httpStatus);
    renderItems(data.items || []);
  }

  function renderStatus(name, d, fnStatus) {
    $('status').innerHTML = `
      <div class="card status ${d.ok ? 'ok' : 'err'}">
        <h2>${d.ok ? '조회 성공' : '조회 실패'} · ‘${esc(name)}’</h2>
        <dl>
          <dt>resultCode</dt><dd><code>${esc(d.resultCode ?? '(없음)')}</code></dd>
          <dt>resultMsg</dt><dd><code>${esc(d.resultMsg ?? '(없음)')}</code></dd>
          <dt>API HTTP</dt><dd>${esc(d.httpStatus ?? '-')}</dd>
          <dt>함수 HTTP</dt><dd>${esc(fnStatus ?? '-')}</dd>
          ${d.totalCount != null ? `<dt>totalCount</dt><dd>${esc(d.totalCount)}</dd>` : ''}
          ${d.requestUrl ? `<dt>요청 주소</dt><dd><code>${esc(d.requestUrl)}</code></dd>` : ''}
        </dl>
        ${d.raw ? `<details><summary>원문 응답 일부</summary><pre>${esc(d.raw)}</pre></details>` : ''}
      </div>`;
  }

  function renderItems(items) {
    if (!items.length) { $('results').innerHTML = ''; return; }
    $('results').innerHTML = items.map(it => {
      const title = it.mntnNm || Object.values(it)[0] || '이름 없음';
      const rows = Object.entries(it)
        .filter(([, v]) => v !== '' && v != null && typeof v !== 'object')
        .map(([k, v]) => `<dt>${esc(LABELS[k] || k)} <span class="key">${LABELS[k] ? esc(k) : ''}</span></dt><dd>${esc(v)}</dd>`)
        .join('');
      return `<article class="card item"><h2>${esc(title)}${it.mntnHght ? `<small>${esc(it.mntnHght)}m</small>` : ''}</h2><dl>${rows}</dl></article>`;
    }).join('');
  }

  $('search').addEventListener('submit', e => { e.preventDefault(); search($('mountain').value); });
  document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { $('mountain').value = b.dataset.q; search(b.dataset.q); }));
</script>
</body>
</html>
